# Production-oriented compose (app + workers).
# Expects managed/external Postgres, RabbitMQ, object storage, Centrifugo via .env.
# For local infra (RabbitMQ, MinIO, ngrok, Air, Go caches): use compose.dev.yaml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    command: ["./api"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dispatcher
    command: ["./dispatcher"]
    env_file:
      - .env
    restart: unless-stopped

  metadata:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: metadata
    command: ["./metadata"]
    env_file:
      - .env
    restart: unless-stopped

  heuristic:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: heuristic
    command: ["./heuristic"]
    env_file:
      - .env
    restart: unless-stopped

  aimodel:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aimodel
    command: ["./aimodel"]
    env_file:
      - .env
    restart: unless-stopped
